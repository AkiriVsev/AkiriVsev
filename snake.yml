# Put this file at: .github/workflows/snake.yml (inside your AkiriVsev/AkiriVsev repo)
# It regenerates the copper/gold "mechanical serpent" every 12 hours and on every push to main.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate the snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23B87333&color_dots=%232B1B0E,%235C3A1E,%238B5A2B,%23B87333,%23D4A017
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23D4A017

      - name: Push output to the "output" branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation"
